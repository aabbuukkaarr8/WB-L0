<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders UI</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; color: #111; }
    .card { max-width: 880px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .row { display: flex; gap: 8px; margin: 12px 0; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    button { padding: 10px 16px; border: 0; background: #111; color: #fff; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .hint { color: #666; font-size: 13px; margin-top: 4px; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 8px; overflow: auto; }
    .links { margin-top: 16px; font-size: 14px; }
    .links a { margin-right: 12px; }
    .status { font-size: 13px; margin-left: 8px; }
  </style>
  <script>
    async function healthz() {
      const el = document.getElementById('health');
      try {
        const res = await fetch('/healthz');
        el.textContent = res.ok ? 'ok' : 'down';
        el.style.color = res.ok ? 'green' : 'red';
      } catch { el.textContent = 'down'; el.style.color = 'red'; }
    }

    async function fetchOrder() {
      const uid = document.getElementById('uid').value.trim();
      const out = document.getElementById('out');
      const btn = document.getElementById('btn');
      out.textContent = '';
      if (!uid) { out.textContent = 'Введите order_uid'; return; }
      btn.disabled = true;
      try {
        const res = await fetch(`/order/${encodeURIComponent(uid)}`);
        const text = await res.text();
        try {
          const json = JSON.parse(text);
          out.textContent = JSON.stringify(json, null, 2);
        } catch {
          out.textContent = text || (res.ok ? 'Пустой ответ' : 'Ошибка');
        }
      } catch (e) {
        out.textContent = 'Ошибка сети: ' + (e?.message || e);
      } finally { btn.disabled = false; }
    }

    window.addEventListener('DOMContentLoaded', healthz);
  </script>
</head>
<body>
  <div class="card">
    <h1>
      Orders UI
      <span class="status">health: <b id="health">…</b></span>
    </h1>
    <div class="row">
      <input id="uid" placeholder="Введите order_uid" />
      <button id="btn" onclick="fetchOrder()">Найти</button>
    </div>
    <div class="hint">Вставьте order_uid и нажмите Найти. Данные берутся из GET /order/{order_uid}.</div>
    <pre id="out"></pre>
    <div class="links">
      <a href="/metrics" target="_blank">/metrics</a>
      <a href="/swagger/index.html" target="_blank">Swagger (если подключен)</a>
    </div>
  </div>
</body>
</html>
