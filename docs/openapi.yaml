openapi: 3.0.3
info:
  title: L0 Orders API
  version: 1.0.0
  description: API для чтения заказов
servers:
  - url: http://localhost:8081
    description: Local server
paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /order/{order_uid}:
    get:
      summary: Get order
      description: Возвращает заказ по UID
      operationId: getOrder
      tags:
        - orders
      parameters:
        - in: path
          name: order_uid
          required: true
          description: Идентификатор заказа (Order UID)
          schema:
            type: string
      responses:
        '200':
          description: Заказ найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Заказ не найден
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  schemas:
    Order:
      type: object
      properties:
        order_uid:
          type: string
        track_number:
          type: string
        entry:
          type: string
        delivery:
          $ref: '#/components/schemas/Delivery'
        payment:
          $ref: '#/components/schemas/Payment'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        locale:
          type: string
        internal_signature:
          type: string
        customer_id:
          type: string
        delivery_service:
          type: string
        shardkey:
          type: string
        sm_id:
          type: integer
        date_created:
          type: string
          description: Дата создания (строка)
        oof_shard:
          type: string
      required:
        - order_uid
        - track_number
        - entry
        - delivery
        - payment
        - items
        - locale
        - customer_id
        - delivery_service
        - shardkey
        - sm_id
        - date_created
        - oof_shard
    Delivery:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        zip:
          type: string
        city:
          type: string
        address:
          type: string
        region:
          type: string
        email:
          type: string
          format: email
      required:
        - name
        - phone
        - zip
        - city
        - address
        - region
        - email
    Payment:
      type: object
      properties:
        transaction:
          type: string
        request_id:
          type: string
        currency:
          type: string
        provider:
          type: string
        amount:
          type: integer
        payment_dt:
          type: integer
          format: int64
        bank:
          type: string
        delivery_cost:
          type: integer
        goods_total:
          type: integer
        custom_fee:
          type: integer
      required:
        - transaction
        - currency
        - provider
        - amount
        - payment_dt
        - bank
        - delivery_cost
        - goods_total
        - custom_fee
    Item:
      type: object
      properties:
        chrt_id:
          type: integer
        track_number:
          type: string
        price:
          type: integer
        rid:
          type: string
        name:
          type: string
        sale:
          type: integer
        size:
          type: string
        total_price:
          type: integer
        nm_id:
          type: integer
        brand:
          type: string
        status:
          type: integer
      required:
        - chrt_id
        - track_number
        - price
        - rid
        - name
        - sale
        - size
        - total_price
        - nm_id
        - brand
        - status

